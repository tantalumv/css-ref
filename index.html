                  <button type="button" class="search-option" data-class:active="$activeCats.length === 0" data-on:click="$activeCats = []; $searchCatOpen = false">All</button>
                </li>
                <li>
                  <button type="button" class="search-option" data-class:active="$activeCats.includes('Layout')" data-on:click="$activeCats = ['Layout']; $searchCatOpen = false">Layout</button>
                </li>
                <li>
                  <button type="button" class="search-option" data-class:active="$activeCats.includes('Flexbox')" data-on:click="$activeCats = ['Flexbox']; $searchCatOpen = false">Flexbox</button>
                </li>
                <li>
                  <button type="button" class="search-option" data-class:active="$activeCats.includes('Grid')" data-on:click="$activeCats = ['Grid']; $searchCatOpen = false">Grid</button>
                </li>
                <li>
                  <button type="button" class="search-option" data-class:active="$activeCats.includes('Typography')" data-on:click="$activeCats = ['Typography']; $searchCatOpen = false">Typography</button>
                </li>
                <li>
                  <button type="button" class="search-option" data-class:active="$activeCats.includes('Color')" data-on:click="$activeCats = ['Color']; $searchCatOpen = false">Color</button>
                </li>
                <li>
                  <button type="button" class="search-option" data-class:active="$activeCats.includes('Sizing')" data-on:click="$activeCats = ['Sizing']; $searchCatOpen = false">Sizing</button>
                </li>
                <li>
                  <button type="button" class="search-option" data-class:active="$activeCats.includes('Visual')" data-on:click="$activeCats = ['Visual']; $searchCatOpen = false">Visual</button>
                </li>
                <li>
                  <button type="button" class="search-option" data-class:active="$activeCats.includes('Animation')" data-on:click="$activeCats = ['Animation']; $searchCatOpen = false">Animation</button>
                </li>
                <li>
                  <button type="button" class="search-option" data-class:active="$activeCats.includes('Transform')" data-on:click="$activeCats = ['Transform']; $searchCatOpen = false">Transform</button>
                </li>
                <li>
                  <button type="button" class="search-option" data-class:active="$activeCats.includes('Spacing')" data-on:click="$activeCats = ['Spacing']; $searchCatOpen = false">Spacing</button>
                </li>
                <li>
                  <button type="button" class="search-option" data-class:active="$activeCats.includes('Interactivity')" data-on:click="$activeCats = ['Interactivity']; $searchCatOpen = false">Interactivity</button>
                </li>
                <li>
                  <button type="button" class="search-option" data-class:active="$activeCats.includes('CSS Variables')" data-on:click="$activeCats = ['CSS Variables']; $searchCatOpen = false">CSS Variables</button>
                </li>
                <li>
                  <button type="button" class="search-option" data-class:active="$activeCats.includes('Queries')" data-on:click="$activeCats = ['Queries']; $searchCatOpen = false">Queries</button>
                </li>
                <li>
                  <button type="button" class="search-option" data-class:active="$activeCats.includes('Selectors')" data-on:click="$activeCats = ['Selectors']; $searchCatOpen = false">Selectors</button>
                </li>
                <li>
                  <button type="button" class="search-option" data-class:active="$activeCats.includes('UI Components')" data-on:click="$activeCats = ['UI Components']; $searchCatOpen = false">UI Components</button>
                </li>
                <li>
                  <button type="button" class="search-option" data-class:active="$activeCats.includes('Tables')" data-on:click="$activeCats = ['Tables']; $searchCatOpen = false">Tables</button>
                </li>
                <li>
                  <button type="button" class="search-option" data-class:active="$activeCats.includes('Lists')" data-on:click="$activeCats = ['Lists']; $searchCatOpen = false">Lists</button>
                </li>
                <li>
                  <button type="button" class="search-option" data-class:active="$activeCats.includes('Breaks')" data-on:click="$activeCats = ['Breaks']; $searchCatOpen = false">Breaks</button>
                </li>
                <li>
                  <button type="button" class="search-option" data-class:active="$activeCats.includes('Misc')" data-on:click="$activeCats = ['Misc']; $searchCatOpen = false">Misc</button>
                </li>
              </ul>
            </div>
            <!-- End Category Dropdown -->

            <!-- Interoperability Dropdown -->
            <div class="search-dropdown" data-on:click__outside="$searchInteropOpen = false">
              <button
                type="button"
                class="search-dropdown-trigger"
                data-on:click="$searchCatOpen = false; $searchBrowserOpen = false; $searchInteropOpen = !$searchInteropOpen"
                data-attr:aria-expanded="$searchInteropOpen ? 'true' : 'false'"
                aria-haspopup="listbox"
              >
                <span
                  data-text="$activeInterops.length === 0 ? 'interop' : ($activeInterops[0] === 'wide' ? 'available' : ($activeInterops[0] === 'b2024' ? 'baseline 2024' : ($activeInterops[0] === 'b2023' ? 'baseline 2023' : ($activeInterops[0] === 'b2022' ? 'baseline 2022' : ($activeInterops[0] === 'ltd' ? 'limited' : 'experimental')))))"
                ></span>
              </button>
              <ul class="search-dropdown-menu" data-show="$searchInteropOpen" role="listbox">
                <li>
                  <button type="button" class="search-option" data-class:active="$activeInterops.length === 0" data-on:click="$activeInterops = []; $searchInteropOpen = false">All</button>
                </li>
                <li>
                  <button type="button" class="search-option" data-class:active="$activeInterops.includes('wide')" data-on:click="$activeInterops = ['wide']; $searchInteropOpen = false">Available</button>
                </li>
                <li>
                  <button type="button" class="search-option" data-class:active="$activeInterops.includes('b2024')" data-on:click="$activeInterops = ['b2024']; $searchInteropOpen = false">Baseline 2024</button>
                </li>
                <li>
                  <button type="button" class="search-option" data-class:active="$activeInterops.includes('b2023')" data-on:click="$activeInterops = ['b2023']; $searchInteropOpen = false">Baseline 2023</button>
                </li>
                <li>
                  <button type="button" class="search-option" data-class:active="$activeInterops.includes('b2022')" data-on:click="$activeInterops = ['b2022']; $searchInteropOpen = false">Baseline 2022</button>
                </li>
                <li>
                  <button type="button" class="search-option" data-class:active="$activeInterops.includes('ltd')" data-on:click="$activeInterops = ['ltd']; $searchInteropOpen = false">Limited</button>
                </li>
                <li>
                  <button type="button" class="search-option" data-class:active="$activeInterops.includes('exp')" data-on:click="$activeInterops = ['exp']; $searchInteropOpen = false">Experimental</button>
                </li>
              </ul>
            </div>
            <!-- End Interoperability Dropdown -->

            <!-- Browser Dropdown -->
            <div class="search-dropdown" data-on:click__outside="$searchBrowserOpen = false">
              <button
                type="button"
                class="search-dropdown-trigger"
                data-on:click="$searchCatOpen = false; $searchInteropOpen = false; $searchBrowserOpen = !$searchBrowserOpen"
                data-attr:aria-expanded="$searchBrowserOpen ? 'true' : 'false'"
                aria-haspopup="listbox"
              >
                <span
                  data-text="$activeBrowsers.length ? ($activeBrowsers[0] === 'ch' ? 'Chrome' : $activeBrowsers[0] === 'ff' ? 'Firefox' : $activeBrowsers[0] === 'sf' ? 'Safari' : 'Edge') : 'browser'"
                ></span>
              </button>
              <ul class="search-dropdown-menu" data-show="$searchBrowserOpen" role="listbox">
                <li>
                  <button type="button" class="search-option" data-class:active="$activeBrowsers.length === 0" data-on:click="$activeBrowsers = []; $searchBrowserOpen = false">All</button>
                </li>
                <li>
                  <button type="button" class="search-option" data-class:active="$activeBrowsers.includes('ch')" data-on:click="$activeBrowsers = ['ch']; $searchBrowserOpen = false">Chrome</button>
                </li>
                <li>
                  <button type="button" class="search-option" data-class:active="$activeBrowsers.includes('ff')" data-on:click="$activeBrowsers = ['ff']; $searchBrowserOpen = false">Firefox</button>
                </li>
                <li>
                  <button type="button" class="search-option" data-class:active="$activeBrowsers.includes('sf')" data-on:click="$activeBrowsers = ['sf']; $searchBrowserOpen = false">Safari</button>
                </li>
                <li>
                  <button type="button" class="search-option" data-class:active="$activeBrowsers.includes('ed')" data-on:click="$activeBrowsers = ['ed']; $searchBrowserOpen = false">Edge</button>
                </li>
              </ul>
            </div>
            <!-- End Browser Dropdown -->
          </div>
          <!-- End Search Selects -->

          <div class="clear-filters-wrapper">
            <button
              type="button"
              class="clear-filters-btn"
              data-show="$activeCats.length || $activeInterops.length || $activeBrowsers.length"
              data-on:click="$activeCats = []; $activeInterops = []; $activeBrowsers = []"
              title="Clear all filters"
            >
              <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
              </svg>
              <span>clear filter</span>
            </button>
          </div>
        </div>
        <!-- End Filter Dropdowns -->
      </div>
      <!-- End Command Palette Header -->
    </div>
    <!-- End Command Palette -->

    <!-- ==============================
         VIEWS
         ============================== -->

    <!-- Grid View - Declarative rendering with data-effect -->
    <div id="grid-view" data-show="$viewMode === 'grid' && $selectedProp === '' && $activeCollection === ''">
      <main id="main-content">
        <div
          id="grid"
          class="is-grid"
          data-effect="$viewMode; $selectedProp; $activeCollection; renderGrid(filtered($query, $activeCats, $activeInterops, $activeBrowsers), $selectedProp)"
        ></div>
      </main>
    </div>
    <!-- End Grid View -->

    <!-- Collection View -->
    <div
      id="collection-view"
      data-show="$activeCollection !== ''"
      data-effect="renderCollectionPage($activeCollection)"
      data-signal="{ showGridOverlay: false, isPaused: false, justifycontent: 'flex-start', alignitems: 'stretch', flexwrap: 'nowrap', flexdirection: 'row', flexgrow: '0', flexshrink: '1', flexbasis: 'auto', gridtemplatecolumns: '1fr 1fr 1fr', gridtemplaterows: 'auto', gap: '16px', gridcolumn: 'auto', gridrow: 'auto', fontsize: '16px', lineheight: '1.6', letterspacing: '0px', animationname: 'none', animationduration: '1s', animationtimingfunction: 'ease', animationdirection: 'normal', animationfillmode: 'none', position: 'static', top: 'auto', right: 'auto', bottom: 'auto', left: 'auto', zindex: 'auto', transitionproperty: 'all', transitionduration: '0.3s', transitiontimingfunction: 'ease', transitiondelay: '0s', backgroundimage: 'none', backgroundsize: 'auto', backgroundposition: '0% 0%', backgroundrepeat: 'repeat' }"
    ></div>
    <!-- End Collection View -->

    <!-- Table View - Using List.js -->
    <div
      id="table-view"
      data-show="$viewMode === 'table' && $selectedProp === ''"
      data-effect="$viewMode; $selectedProp; $activeCollection; initListTable(filtered($query, $activeCats, $activeInterops, $activeBrowsers))"
    >
      <div id="table-container">
        <table class="list-table">
          <thead>
            <tr>
              <th class="sort" data-sort="prop-name">Property</th>
              <th class="sort" data-sort="prop-category">Category</th>
              <th class="sort" data-sort="prop-preview">Preview</th>
              <th class="sort" data-sort="prop-support-sort">Support</th>
            </tr>
          </thead>
          <tbody class="list">
            <!-- Rows rendered by data-effect -->
          </tbody>
        </table>
      </div>
      <div id="table-sentinel" data-on-intersect__half="loadMoreTableRows()">Loading more...</div>
    </div>
    <!-- End Table View -->

    <!-- Detail View - Rendered by JS -->
    <div
      id="detail-view"
      data-show="$selectedProp !== ''"
      data-class:open="$selectedProp !== ''"
      data-effect="renderDetail($selectedProp); $selectedProp"
    ></div>
    <!-- End Detail View -->

    <!-- ==============================
         ROUTING
         ============================== -->

    <!-- Hash routing: sync hash ↔ signal -->
    <div
      data-on:hashchange__window="!location.hash.startsWith('#!') && ($selectedProp = decodeURIComponent(location.hash.slice(1)))"
      style="display: none"
    ></div>
    <div
      data-init="!location.hash.startsWith('#!') && ($selectedProp = decodeURIComponent(location.hash.slice(1) || ''))"
      style="display: none"
    ></div>
    <!-- Custom event for setting selected property from card clicks -->
    <div
      data-on:set-selected-prop__window="$selectedProp = decodeURIComponent($event.detail)"
      style="display: none"
    ></div>

    <!-- Collection routing -->
    <div
      data-on:hashchange__window="if(location.hash.startsWith('#!')){$activeCollection=decodeURIComponent(location.hash.slice(2));$selectedProp=''}else if(location.hash === '' || location.hash === '#'){$activeCollection=''}else if(location.hash.startsWith('#') && !location.hash.startsWith('#!')){$activeCollection=''}"
      style="display: none"
    ></div>
    <div
      data-init="if(location.hash.startsWith('#!')){$activeCollection=decodeURIComponent(location.hash.slice(2))}"
      style="display: none"
    ></div>

    <!-- Escape key handler -->
    <div
      data-on:keydown__window="evt.key === 'Escape' && (location.hash = '')"
      style="display: none"
    ></div>
    <!-- End Routing -->

    <!-- ==============================
         PROPERTY COUNTER
         ============================== -->
    <div
      class="property-counter"
      data-effect="$filteredCount = filtered($query, $activeCats, $activeInterops, $activeBrowsers).length; $totalCount = CSS_PROPERTIES.length"
      data-text="$filteredCount + ' / ' + $totalCount + ' properties'"
    ></div>

    <!-- ==============================
         SCRIPTS
         ============================== -->
    <script type="module" defer id="main-bundle" src="dist/bundle.455ae565.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/list.js/2.3.1/list.min.js" defer></script>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/gh/starfederation/datastar@1.0.0-RC.8/bundles/datastar.js"
      defer
    ></script>
    <script>
      document.documentElement.classList.add("dark");
      
      // Register service worker for offline caching
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/dist/sw.js')
            .then(reg => console.log('SW registered:', reg.scope))
            .catch(err => console.log('SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
